# vim: set colorcolumn=:
name: ci-cd

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      php_version:
        description: "Specify the PHP version to use (e.g., 8.5)"
        required: false
        default: '8.5'

env:
  PHP_VERSION: ${{ inputs.php_version || '8.5' }}

permissions:
  contents: read

jobs:
  linter:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Update apt cache
        run: sudo apt-get update

      - name: Install PHP ${{ env.PHP_VERSION }}
        env:
          _PHP_VER: ${{ env.PHP_VERSION }}
        run: |
          [[ "$_PHP_VER" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "Invalid PHP version: $_PHP_VER"; exit 1; }
          sudo apt-get install -y "php${_PHP_VER}-cli" "php${_PHP_VER}-curl" "php${_PHP_VER}-mbstring" "php${_PHP_VER}-xml"

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: lib
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install composer/vendor dependencies
        run: composer install --prefer-dist --no-progress

      - name: Validate PHP syntax
        run: bash -c 'set -e;for file in $(find ./src ./tests -type f -regex ".*\.\(php\|phtml\)" -print); do php -e -l -f "$file"; done'

  tests:
    needs: [linter]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Update apt cache
        run: sudo apt-get update

      - name: Install PHP ${{ env.PHP_VERSION }}
        env:
          _PHP_VER: ${{ env.PHP_VERSION }}
        run: |
          [[ "$_PHP_VER" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "Invalid PHP version: $_PHP_VER"; exit 1; }
          sudo apt-get install -y "php${_PHP_VER}-cli" "php${_PHP_VER}-curl" "php${_PHP_VER}-mbstring" "php${_PHP_VER}-xml"

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: lib
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install composer/vendor dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit tests
        run: lib/bin/phpunit --testdox
